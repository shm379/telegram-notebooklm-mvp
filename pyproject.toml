[project]
name = "telegram-notebooklm-mvp"
version = "0.3.0"
description = "Ingest public Telegram channels, transcribe media, and search transcripts."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "google-genai==1.66.0",
  "openai>=1.75.0",
  "python-dotenv>=1.0.1",
  "telethon>=1.39.0",
  "telegramify-markdown>=1.2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
# Optional: Audio Overview / podcast generation from the archive (/podcast).
# Heavy, so it is opt-in: pip install ".[podcast]"
podcast = ["podcastfy>=0.4.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/telegram_notebook"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
# pycodestyle errors, pyflakes, isort, pyupgrade, flake8-bugbear
select = ["E", "F", "I", "UP", "B"]
ignore = [
  "E501",  # line length is enforced loosely; long SQL/HTML strings are fine
  "B008",  # function calls in argument defaults (not used in a harmful way here)
]
